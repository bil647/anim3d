name: Render
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Render
        run: blender -b -P animation.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
