name: Render
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Render
        run: blender -b -P animation.py
      - name: Encode
        run: |
          ffmpeg -y -framerate 24 -pattern_type glob -i 'out/frames/f_*.png' -c:v libx264 -pix_fmt yuv420p out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
